<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AESTE — Site officiel</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f3b;--mu:#5d6385;--bd:#e4e6f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#181b33;--tx:#f0f1fa;--mu:#a3a8cc;--bd:#2a2e52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--card:#181b33;--tx:#f0f1fa;--mu:#a3a8cc;--bd:#2a2e52;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
html[lang=fr] .en,html[lang=en] .fr{display:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;background:linear-gradient(90deg,#6366f1,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:14px;color:var(--mu);text-decoration:none;cursor:pointer}
nav a.on{background:var(--c);color:#fff}
#lang{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:18px 14px 40px}
.hero{border-radius:24px;padding:36px 22px;color:#fff;text-align:center;background:linear-gradient(135deg,#24496a,#2f7d4f 65%,#6cb33f)}
.hero .big{width:120px;height:120px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 8px 24px #0004}.hero .md{margin-top:12px!important;font-weight:700;letter-spacing:.5px}.hero h1{margin:6px 0;font-size:clamp(28px,6vw,44px)}.hero p{margin:0 auto;max-width:560px;opacity:.95}
.hero .g{font-size:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--c);border-radius:18px;padding:18px;transition:transform .15s}
a.card{text-decoration:none;color:inherit;cursor:pointer}a.card:hover{transform:translateY(-4px)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.card h3{margin:10px 0 4px;font-size:18px}.card p{margin:0;color:var(--mu);font-size:14px}
.ph{margin-top:14px;padding:5px 10px;display:inline-block;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:600}
.top{border-radius:22px;padding:28px 20px;color:#fff;background:var(--c)}.top h2{margin:6px 0 4px;font-size:28px}.top p{margin:0;opacity:.92}
.btn{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:99px;background:var(--c);color:#fff;text-decoration:none;font-weight:700;font-size:14px}footer a{color:var(--tx);text-decoration:none;font-weight:600;margin:0 8px;white-space:nowrap}footer{text-align:center;color:var(--mu);font-size:13px;padding:20px}
</style>
</head>
